name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: tfl
      POSTGRES_USER: tfl_user
      POSTGRES_PASSWORD: tfl_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tfl
          POSTGRES_USER: tfl_user
          POSTGRES_PASSWORD: tfl_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfl_user -d tfl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database schema
        run: |
          python -c "from pathlib import Path; from tfl_pipeline.database import get_connection; conn = get_connection(); conn.execute(Path('sql/001_create_tube_lines.sql').read_text()); conn.execute(Path('sql/002_create_tube_status_snapshots.sql').read_text()); conn.commit(); conn.close()"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest